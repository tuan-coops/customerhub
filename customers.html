<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý khách hàng | EduCare CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page-title="Quản lý khách hàng" data-active-page="customers">
    <!-- layout.js sẽ dựng khung trang và nạp nội dung từ #pageContent -->
    <div id="app"></div>

    <template id="pageContent">
        <!-- Tiêu đề trang & Nút hành động chính -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h2 class="h4 fw-bold mb-1">Quản lý thông tin khách hàng</h2>
                <p class="text-secondary small mb-0">Thực hiện đầy đủ thao tác Thêm, Xem, Sửa, Xóa và Tìm kiếm bằng AJAX.</p>
            </div>
            <button class="btn btn-primary" type="button" id="createCustomerButton">
                <i class="bi bi-person-plus-fill me-1" aria-hidden="true"></i>Thêm khách hàng
            </button>
        </div>

        <!-- Bộ lọc & Tìm kiếm dữ liệu -->
        <section class="panel mb-4" aria-label="Bộ lọc tìm kiếm">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-4 col-xl-3">
                    <label class="form-label" for="keyword">Tìm kiếm</label>
                    <div class="search-wrap">
                        <i class="bi bi-search" aria-hidden="true"></i>
                        <input class="form-control" id="keyword" placeholder="Tên, SĐT, email hoặc mã KH">
                    </div>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <label class="form-label" for="typeFilter">Trạng thái tư vấn</label>
                    <select class="form-select" id="typeFilter">
                        <option value="">Tất cả trạng thái</option>
                        <option value="lead">Tiềm năng</option>
                        <option value="consulting">Đang tư vấn</option>
                        <option value="high_interest">Quan tâm cao</option>
                        <option value="appointment">Đã hẹn</option>
                        <option value="registered">Đã đăng ký</option>
                        <option value="no_demand">Chưa có nhu cầu</option>
                        <option value="unreachable">Không liên hệ được</option>
                    </select>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <label class="form-label" for="sourceFilter">Nguồn khách</label>
                    <select class="form-select" id="sourceFilter">
                        <option value="">Tất cả nguồn</option>
                        <option>Website</option>
                        <option>Facebook</option>
                        <option>Zalo</option>
                        <option>Giới thiệu</option>
                        <option>Hotline</option>
                        <option>Khác</option>
                    </select>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <label class="form-label" for="statusFilter">Hồ sơ</label>
                    <select class="form-select" id="statusFilter">
                        <option value="active">Đang hoạt động</option>
                        <option value="inactive">Ngừng theo dõi</option>
                        <option value="">Tất cả</option>
                    </select>
                </div>
                <div class="col-6 col-md-4 col-xl-2">
                    <label class="form-label" for="sortFilter">Sắp xếp</label>
                    <select class="form-select" id="sortFilter">
                        <option value="updated_desc">Mới cập nhật</option>
                        <option value="updated_asc">Cũ cập nhật</option>
                        <option value="name_asc">Tên A–Z</option>
                        <option value="name_desc">Tên Z–A</option>
                    </select>
                </div>
                <div class="col-12 col-md-4 col-xl-1 d-flex">
                    <button class="btn btn-outline-secondary w-100" id="resetFilters" type="button" title="Đặt lại bộ lọc">
                        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Bảng danh sách khách hàng -->
        <section class="panel" aria-label="Bảng khách hàng">
            <div class="panel-header">
                <div>
                    <h3 class="section-title">Danh sách hồ sơ</h3>
                    <p class="section-subtitle mb-0" id="resultSummary">Đang tải dữ liệu...</p>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Khách hàng</th>
                            <th>Nhu cầu &amp; Ngoại ngữ</th>
                            <th>Trạng thái</th>
                            <th>Người phụ trách</th>
                            <th>Cập nhật</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="customerRows"></tbody>
                </table>
            </div>

            <!-- Phân trang bằng AJAX -->
            <div class="d-flex justify-content-end align-items-center mt-3 pt-2">
                <nav aria-label="Phân trang danh sách khách hàng">
                    <ul class="pagination mb-0" id="pagination"></ul>
                </nav>
            </div>
        </section>

        <!-- Modal Thêm / Sửa khách hàng (dùng chung, AJAX xử lý) -->
        <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <form id="customerForm" novalidate>
                        <div class="modal-header">
                            <div>
                                <h3 class="modal-title" id="customerModalTitle">Thêm khách hàng</h3>
                                <p class="modal-subtitle">Điền thông tin khách hàng vào các trường bên dưới.</p>
                            </div>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                        </div>
                        <div class="modal-body">
                            <div id="formAlert" class="alert alert-danger d-none" role="alert" tabindex="-1"></div>
                            <input type="hidden" name="id" id="customerId">

                            <!-- Khối 1: Thông tin cá nhân -->
                            <div class="form-section-title">
                                <i class="bi bi-person me-1"></i>1. Thông tin cá nhân
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label required" for="fullName">Họ và tên</label>
                                    <input class="form-control" id="fullName" name="full_name" maxlength="100" placeholder="Ví dụ: Nguyễn Văn An" required>
                                    <div class="invalid-feedback">Vui lòng nhập họ và tên.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label required" for="phoneNumber">Số điện thoại</label>
                                    <input class="form-control" type="tel" id="phoneNumber" name="phone_number" maxlength="20" pattern="(?:\+84|0)[0-9]{8,10}" placeholder="Ví dụ: 0912345678" required>
                                    <div class="invalid-feedback">Số điện thoại hợp lệ từ 8-11 chữ số.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="email">Địa chỉ Email</label>
                                    <input class="form-control" type="email" id="email" name="email" placeholder="example@gmail.com">
                                    <div class="invalid-feedback">Email chưa đúng định dạng.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="occupation">Nghề nghiệp</label>
                                    <input class="form-control" id="occupation" name="occupation" placeholder="Ví dụ: Sinh viên, Kỹ sư, Kế toán...">
                                </div>
                            </div>

                            <!-- Khối 2: Nhu cầu đào tạo & Quản lý -->
                            <div class="form-section-title">
                                <i class="bi bi-journal-text me-1"></i>2. Nhu cầu đào tạo &amp; Quản trị
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label required" for="languageInterest">Ngoại ngữ quan tâm</label>
                                    <input class="form-control" id="languageInterest" name="language_interest" placeholder="Tiếng Anh, Tiếng Nhật, Hàn, Trung..." required>
                                    <div class="invalid-feedback">Vui lòng nhập ngoại ngữ.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="learningGoal">Mục tiêu học tập</label>
                                    <input class="form-control" id="learningGoal" name="learning_goal" placeholder="Ví dụ: IELTS 6.5, JLPT N3, Giao tiếp...">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="currentLevel">Trình độ hiện tại</label>
                                    <input class="form-control" id="currentLevel" name="current_level" placeholder="Mới bắt đầu, Sơ cấp, B1...">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="preferredSchedule">Thời gian mong muốn</label>
                                    <input class="form-control" id="preferredSchedule" name="preferred_schedule" placeholder="Tối thứ 2-4-6, cuối tuần...">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="learningFormat">Hình thức học</label>
                                    <select class="form-select" id="learningFormat" name="learning_format">
                                        <option value="">Chưa xác định</option>
                                        <option value="offline">Tại trung tâm (Offline)</option>
                                        <option value="online">Trực tuyến (Online)</option>
                                        <option value="hybrid">Kết hợp (Hybrid)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="source">Nguồn khách hàng</label>
                                    <select class="form-select" id="source" name="source">
                                        <option>Website</option>
                                        <option>Facebook</option>
                                        <option>Zalo</option>
                                        <option>Giới thiệu</option>
                                        <option>Hotline</option>
                                        <option>Khác</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="customerType">Trạng thái tư vấn</label>
                                    <select class="form-select" id="customerType" name="customer_type">
                                        <option value="lead">Tiềm năng</option>
                                        <option value="consulting">Đang tư vấn</option>
                                        <option value="high_interest">Quan tâm cao</option>
                                        <option value="appointment">Đã hẹn</option>
                                        <option value="registered">Đã đăng ký</option>
                                        <option value="no_demand">Chưa có nhu cầu</option>
                                        <option value="unreachable">Không liên hệ được</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="customerStatus">Trạng thái hồ sơ</label>
                                    <select class="form-select" id="customerStatus" name="status">
                                        <option value="active">Đang hoạt động</option>
                                        <option value="inactive">Ngừng theo dõi</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="note">Ghi chú bổ sung</label>
                                    <textarea class="form-control" id="note" name="note" rows="3" placeholder="Nhập thêm ghi chú về nhu cầu, trao đổi..."></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy bỏ</button>
                            <button type="submit" class="btn btn-primary" id="saveCustomerButton">
                                <i class="bi bi-check2 me-1" aria-hidden="true"></i>Lưu khách hàng
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal xác nhận xóa khách hàng -->
        <div class="modal fade" id="deleteCustomerModal" tabindex="-1" aria-labelledby="deleteCustomerTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header border-0 pb-0">
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body text-center pt-0 px-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                            <i class="bi bi-trash3"></i>
                        </div>
                        <h3 class="modal-title fs-5 mb-2" id="deleteCustomerTitle">Xác nhận xóa hồ sơ</h3>
                        <p class="text-secondary mb-3">
                            Bạn có chắc chắn muốn xóa hồ sơ khách hàng <strong class="text-dark" id="deleteCustomerName"></strong>?
                        </p>
                        <div class="alert alert-warning py-2 small mb-0 text-start">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            Hành động này sẽ xóa vĩnh viễn dữ liệu khỏi hệ thống và không thể hoàn tác.
                        </div>
                    </div>
                    <div class="modal-footer border-0 justify-content-center pb-4">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-danger px-4" id="confirmDeleteButton">
                            <i class="bi bi-trash3 me-1"></i>Xóa vĩnh viễn
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/customers.js"></script>
</body>
</html>
